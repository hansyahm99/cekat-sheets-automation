name: Cekat Sheets Ingest

on:
  schedule:
    # 01:00 UTC = 08:00 WIB
    - cron: "0 1 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run ingestion
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          CEKAT_ESL_USER: ${{ secrets.CEKAT_ESL_USER }}
          CEKAT_ESL_PASS: ${{ secrets.CEKAT_ESL_PASS }}
          CEKAT_ESC_USER: ${{ secrets.CEKAT_ESC_USER }}
          CEKAT_ESC_PASS: ${{ secrets.CEKAT_ESC_PASS }}
          CEKAT_EHL_USER: ${{ secrets.CEKAT_EHL_USER }}
          CEKAT_EHL_PASS: ${{ secrets.CEKAT_EHL_PASS }}
        run: python main.py